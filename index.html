<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Proposal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f0f0;
            transition: background-color 0.5s;
        }
        #question {
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
            transition: font-size 0.3s;
        }
        #noBtn {
            background-color: #f44336;
            color: white;
        }
        #happyPage {
            display: none;
            color: blue;
            font-size: 36px;
            background-color: blue;
            color: white;
            padding: 100px;
            min-height: 100vh;
        }
        #thankYouText {
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="questionPage">
        <h1 id="question">Do you want me to be your valentine?</h1>
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
    
    <div id="happyPage">
        <h1>Happy Valentine</h1>
        <p id="thankYouText">Saya sangat bersyukur bisa bersama kamu di hari Valentine ini.</p>
    </div>

    <script>
        let yesSize = 18; // Ukuran awal font tombol Yes (dalam px)
        
        document.getElementById('noBtn').addEventListener('click', function() {
            yesSize += 10; // Tambah ukuran font setiap kali No diklik
            document.getElementById('yesBtn').style.fontSize = yesSize + 'px';
        });
        
        document.getElementById('yesBtn').addEventListener('click', function() {
            // Sembunyikan halaman pertanyaan dan tampilkan halaman Happy Valentine
            document.getElementById('questionPage').style.display = 'none';
            document.getElementById('happyPage').style.display = 'block';
        });
    </script>
</body>
</html>
